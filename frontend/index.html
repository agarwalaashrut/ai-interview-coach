<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Interview Coach</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 600px;
        height: 90vh;
        max-height: 800px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
        flex-shrink: 0;
      }

      .header h1 {
        font-size: 24px;
        font-weight: 600;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
        margin-top: 4px;
      }

      .chat-history {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        display: flex;
        margin-bottom: 8px;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        justify-content: flex-end;
      }

      .message.assistant {
        justify-content: flex-start;
      }

      .message-content {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 12px;
        word-wrap: break-word;
        line-height: 1.4;
      }

      .message.user .message-content {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message.assistant .message-content {
        background: #f0f0f0;
        color: #333;
        border-bottom-left-radius: 4px;
      }

      .message.error .message-content {
        background: #fee;
        color: #c00;
        border-left: 3px solid #c00;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 12px 16px;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #999;
        animation: typing 1.4s infinite;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          opacity: 0.5;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-10px);
        }
      }

      .input-container {
        padding: 16px;
        border-top: 1px solid #e0e0e0;
        background: white;
        flex-shrink: 0;
      }

      .input-form {
        display: flex;
        gap: 8px;
      }

      .input-form input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.2s;
      }

      .input-form input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .input-form input:disabled {
        background: #f5f5f5;
        color: #999;
        cursor: not-allowed;
      }

      .input-form button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .input-form button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .input-form button:active:not(:disabled) {
        transform: translateY(0);
      }

      .input-form button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        color: #999;
        text-align: center;
      }

      .empty-state-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }

      .empty-state p {
        font-size: 14px;
      }

      /* Scrollbar styling */
      .chat-history::-webkit-scrollbar {
        width: 8px;
      }

      .chat-history::-webkit-scrollbar-track {
        background: #f1f1f1;
      }

      .chat-history::-webkit-scrollbar-thumb {
        background: #ddd;
        border-radius: 4px;
      }

      .chat-history::-webkit-scrollbar-thumb:hover {
        background: #999;
      }

      @media (max-width: 600px) {
        .container {
          max-height: 100vh;
          border-radius: 0;
        }

        .message-content {
          max-width: 90%;
        }

        .header h1 {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🤖 AI Interview Coach</h1>
        <p>Behavioral interview practice</p>
      </div>

      <div class="chat-history" id="chatHistory">
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <p>Start a conversation to get interview tips</p>
        </div>
      </div>

      <div class="input-container">
        <form class="input-form" id="chatForm">
          <input
            type="text"
            id="userInput"
            placeholder="Ask a question or say hello..."
            autocomplete="off"
            required
          />
          <button type="submit" id="sendButton">Send</button>
        </form>
      </div>
    </div>

    <script>
      // Get or create session ID
      function getOrCreateSessionId() {
        let sessionId = localStorage.getItem("chatSessionId");
        if (!sessionId) {
          // Generate a simple session ID
          sessionId = `session_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
          localStorage.setItem("chatSessionId", sessionId);
        }
        return sessionId;
      }

      const sessionId = getOrCreateSessionId();
      const chatHistory = document.getElementById("chatHistory");
      const chatForm = document.getElementById("chatForm");
      const userInput = document.getElementById("userInput");
      const sendButton = document.getElementById("sendButton");

      let isLoading = false;

      // Clear empty state on first message
      function clearEmptyState() {
        const emptyState = chatHistory.querySelector(".empty-state");
        if (emptyState) {
          emptyState.remove();
        }
      }

      // Add message to chat
      function addMessage(content, role) {
        clearEmptyState();

        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${role}`;

        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content";
        contentDiv.textContent = content;

        messageDiv.appendChild(contentDiv);
        chatHistory.appendChild(messageDiv);

        // Scroll to bottom
        scrollToBottom();
      }

      // Show typing indicator
      function showTypingIndicator() {
        clearEmptyState();

        const messageDiv = document.createElement("div");
        messageDiv.className = "message assistant";
        messageDiv.id = "typingIndicator";

        const typingDiv = document.createElement("div");
        typingDiv.className = "typing-indicator";

        for (let i = 0; i < 3; i++) {
          const dot = document.createElement("div");
          dot.className = "typing-dot";
          typingDiv.appendChild(dot);
        }

        messageDiv.appendChild(typingDiv);
        chatHistory.appendChild(messageDiv);

        scrollToBottom();
      }

      // Remove typing indicator
      function removeTypingIndicator() {
        const typingIndicator = document.getElementById("typingIndicator");
        if (typingIndicator) {
          typingIndicator.remove();
        }
      }

      // Scroll chat to bottom
      function scrollToBottom() {
        setTimeout(() => {
          chatHistory.scrollTop = chatHistory.scrollHeight;
        }, 0);
      }

      // Handle form submission
      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const message = userInput.value.trim();
        if (!message) return;

        // Clear input
        userInput.value = "";

        // Add user message
        addMessage(message, "user");

        // Disable input
        isLoading = true;
        userInput.disabled = true;
        sendButton.disabled = true;

        // Show typing indicator
        showTypingIndicator();

        try {
          // Send request to API
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              sessionId,
              userInput: message,
            }),
          });

          removeTypingIndicator();

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            const errorMessage =
              errorData.error || `Error: ${response.status} ${response.statusText}`;
            addMessage(
              `Sorry, I encountered an error: ${errorMessage}`,
              "error"
            );
            return;
          }

          const data = await response.json();

          // Add AI response
          if (data.aiResponse) {
            addMessage(data.aiResponse, "assistant");
          }
        } catch (error) {
          removeTypingIndicator();
          const errorMessage =
            error instanceof Error ? error.message : "Unknown error";
          addMessage(
            `Network error: ${errorMessage}. Please check your connection.`,
            "error"
          );
        } finally {
          // Re-enable input
          isLoading = false;
          userInput.disabled = false;
          sendButton.disabled = false;
          userInput.focus();
        }
      });

      // Focus input on load
      userInput.focus();
    </script>
  </body>
</html>
